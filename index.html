<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (desc && desc.get && !desc.set && desc.configurable) {
            var currentFetch = window.fetch;
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: desc.enumerable,
              get: function () {
                return currentFetch;
              },
              set: function (next) {
                if (typeof next === 'function') {
                  currentFetch = next;
                }
              },
            });
          }
        } catch (_) {}
        window.addEventListener(
          'error',
          function (event) {
            var src = (event && event.filename) || '';
            var msg = (event && event.message) || '';
            if (
              src.indexOf('chrome-extension://') === 0 &&
              msg.indexOf('Cannot set property fetch') !== -1
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
    <title>Red Bird International & Astra-Gravity AI</title>
    <meta
      name="description"
      content="Autonomous multimodal AI workspace, project orchestration, AI music & lyrics studio, and global apparel logistics command platform."
    />
    <meta property="og:title" content="Red Bird International & Astra-Gravity AI" />

      rel="stylesheet"
    />
  </head>

</html>
