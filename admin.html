<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <script>
      (function () {
        try {
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (desc && desc.get && !desc.set && desc.configurable) {
            var currentFetch = window.fetch;
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: desc.enumerable,
              get: function () {
                return currentFetch;
              },
              set: function (next) {
                if (typeof next === 'function') {
                  currentFetch = next;
                }
              },
            });
          }
        } catch (_) {}
        window.addEventListener(
          'error',
          function (event) {
            var src = (event && event.filename) || '';
            var msg = (event && event.message) || '';
            if (
              src.indexOf('chrome-extension://') === 0 &&
              msg.indexOf('Cannot set property fetch') !== -1
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
    <title>Red Bird Portal | Management Access</title>
    <!-- Private management dashboard: never indexed by search engines -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="theme-color" content="#07090F" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔴</text></svg>" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'DM Sans', system-ui, sans-serif;
        scroll-behavior: smooth;
      }
      @media print {
        .no-print {
          display: none !important;
        }
      }
    </style>
  </head>
  <body class="bg-[#07090F] text-slate-100">
    <div id="root"></div>
    <script type="module" src="/admin-main.tsx"></script>
  </body>
</html>
